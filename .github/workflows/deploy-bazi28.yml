name: Deploy Destinyfindor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bazi28/**"
      - ".github/workflows/deploy-bazi28.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Destinyfindor
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload bazi28 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: bazi28

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
